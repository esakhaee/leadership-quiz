<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Leadership Quiz</title>

<style>
:root {
  --brand: #4CAF50;
  --brand-2: #2196F3;
  --bg: #f4f4f4;
  --text: #333;
  --card: #fff;
  --muted: #666;
}
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  margin: 0;
  background: var(--bg);
}
.container {
  max-width: 720px;
  margin: 24px auto;
  padding: 24px;
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
h1 { text-align: center; color: var(--brand); }
.progress { margin: 20px 0; }
.screen { display: none; }
.screen.active { display: block; }
.btn {
  background: var(--brand);
  color: #fff;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.btn.secondary { background: var(--brand-2); }
.muted { color: var(--muted); font-size: 14px; }
input[type="text"], input[type="file"] {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #ddd;
}
</style>
</head>

<body>
<div class="container">
<h1>Leadership Quiz</h1>

<form id="quiz">
<section class="screen active" data-index="0">
<p>1. What motivates you most?</p>
<label><input type="radio" name="q1" value="Visionary"/> Achieving bold goals</label><br>
<label><input type="radio" name="q1" value="Supportive"/> Helping others grow</label><br>
<label><input type="radio" name="q1" value="Strategic"/> Solving complex challenges</label><br><br>
<button type="button" class="btn" onclick="next()">Next</button>
</section>

<section class="screen" data-index="1">
<p>2. How do you make decisions?</p>
<label><input type="radio" name="q2" value="Visionary"/> Fast & intuitive</label><br>
<label><input type="radio" name="q2" value="Supportive"/> Seek input</label><br>
<label><input type="radio" name="q2" value="Strategic"/> Analyse deeply</label><br><br>
<button type="button" class="btn secondary" onclick="submitQuiz()">See Result</button>
</section>
</form>

<section id="result" class="screen">
<h2 id="style-title"></h2>
<p id="style-desc"></p>

<label>Your name</label>
<input id="full-name" type="text" required />

<label style="margin-top:12px;">Optional: Upload your photo</label>
<input id="photo" type="file" accept="image/*" />
<p id="photo-status" class="muted"></p>

<br>
<button class="btn secondary" onclick="generateCertificate()">Download Certificate</button>
</section>

</div>

<script>
const WORKER_URL = "https://red-bird-7216.ehssan-sakhaee.workers.dev/";

let current = 0;

function next() {
  document.querySelector('.screen.active').classList.remove('active');
  current++;
  document.querySelector(`[data-index="${current}"]`).classList.add('active');
}

function submitQuiz() {
  const answers = [...document.querySelectorAll("input[type=radio]:checked")].map(r=>r.value);
  const counts = { Visionary:0, Supportive:0, Strategic:0 };
  answers.forEach(a=>counts[a]++);
  const style = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  showResult(style);
}

function showResult(style) {
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").classList.add("active");
  document.getElementById("style-title").textContent = style;
  document.getElementById("style-desc").textContent =
    style==="Visionary" ? "You inspire bold direction." :
    style==="Supportive" ? "You build trust and safety." :
    "You think strategically for long-term impact.";
}

/* ---------- iPhone FIX: resize + convert to JPEG ---------- */
async function fileToJpegDataUrl(file, maxDim = 1024, quality = 0.9) {
  const dataUrl = await new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });

  const img = await new Promise((resolve,reject)=>{
    const i=new Image();
    i.onload=()=>resolve(i);
    i.onerror=reject;
    i.src=dataUrl;
  });

  let {width,height}=img;
  const scale=Math.min(1,maxDim/Math.max(width,height));
  width=Math.round(width*scale);
  height=Math.round(height*scale);

  const canvas=document.createElement("canvas");
  canvas.width=width;
  canvas.height=height;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,width,height);

  return canvas.toDataURL("image/jpeg",quality);
}

/* ---------- Generate Certificate ---------- */
async function generateCertificate() {
  const name=document.getElementById("full-name").value.trim();
  if(!name) return alert("Please enter your name.");

  const photoInput=document.getElementById("photo");
  const statusEl=document.getElementById("photo-status");

  let portraitDataUrl=null;

  if(photoInput.files.length>0){
    statusEl.textContent="Generating cartoon portrait...";
    try{
      const jpegDataUrl=await fileToJpegDataUrl(photoInput.files[0],1024,0.9);

      const resp=await fetch(WORKER_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({image_data_url:jpegDataUrl})
      });

      const data=await resp.json();
      if(!resp.ok) throw new Error(data.error||"Portrait error");

      portraitDataUrl=data.png_data_url;
      statusEl.textContent="Portrait generated!";
    }catch(e){
      console.error(e);
      statusEl.textContent="Could not generate portrait — continuing without it.";
    }
  }

  createCertificateImage(name, portraitDataUrl);
}

function createCertificateImage(name, portraitDataUrl){
  const W=1600, H=1000;
  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,W,H);

  ctx.font="700 60px Arial";
  ctx.textAlign="center";
  ctx.fillText("Leadership Style Certificate",W/2,150);

  ctx.font="700 48px Arial";
  ctx.fillText(name,W/2,250);

  if(portraitDataUrl){
    const img=new Image();
    img.onload=function(){
      ctx.drawImage(img,W/2-100,350,200,200);
      finish();
    };
    img.src=portraitDataUrl;
  }else{
    finish();
  }

  function finish(){
    canvas.toBlob(blob=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="Leadership_Certificate.png";
      a.click();
    });
  }
}
</script>

</body>
</html>
